<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Liquid Chrome Metallic Outer Ring Gradient -->
    <linearGradient id="chromeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#C0C0C0"/>
      <stop offset="45%" stop-color="#EAEAEA"/>
      <stop offset="65%" stop-color="#71717A"/>
      <stop offset="85%" stop-color="#D4D4D8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Chrome Lettermark Gradient -->
    <linearGradient id="chromeLetter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#D4D4D8"/>
      <stop offset="50%" stop-color="#E4E4E7"/>
      <stop offset="70%" stop-color="#A1A1AA"/>
      <stop offset="90%" stop-color="#F4F4F5"/>
      <stop offset="100%" stop-color="#71717A"/>
    </linearGradient>

    <!-- Obsidian Deep Black Core Gradient -->
    <radialGradient id="obsidianBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="75%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Subtle Glow Shadow Filter -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base (Squircle for Apple / Favicon crispness) -->
  <rect width="512" height="512" rx="112" fill="url(#obsidianBg)" filter="url(#badgeShadow)"/>

  <!-- Outer Chrome Emblem Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#chromeRing)" stroke-width="12" stroke-opacity="0.9"/>
  <rect x="32" y="32" width="448" height="448" rx="84" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Inner Architectural Chrome "R" Monogram -->
  <g transform="translate(136, 106)">
    <!-- Main stem -->
    <rect x="0" y="0" width="58" height="300" rx="4" fill="url(#chromeLetter)"/>
    
    <!-- Top horizontal bar -->
    <rect x="58" y="0" width="100" height="52" fill="url(#chromeLetter)"/>
    
    <!-- Curved lobe outer -->
    <path d="M 158 0 C 220 0, 240 30, 240 85 C 240 140, 220 170, 158 170 L 58 170 L 58 118 L 150 118 C 175 118, 185 105, 185 85 C 185 65, 175 52, 150 52 L 58 52 Z" fill="url(#chromeLetter)"/>
    
    <!-- Aggressive Streetwear Angled Leg -->
    <path d="M 125 155 L 240 300 L 168 300 L 68 170 Z" fill="url(#chromeLetter)"/>
    
    <!-- Subtle Specular Reflection Slash -->
    <path d="M 15 10 L 25 10 L 5 290 L -5 290 Z" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- Precision Star Accent / Registration Mark -->
  <circle cx="410" cy="410" r="10" fill="#4D5936"/>
  <circle cx="410" cy="410" r="5" fill="#A3B88C"/>
</svg>

